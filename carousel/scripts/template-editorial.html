<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&family=DM+Serif+Display&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
  /* Editorial format: full-bleed photo, handle top-left, bold sans headline with ONE highlighted phrase. */
  :root{
    --accent:#CE6A4A;          /* highlight bar (brand terracotta) */
    --ink:#FFFFFF;
    --cream:#F7F4EE; --gold:#D9A441;
    --sans:'Inter', -apple-system, 'Helvetica Neue', Arial, sans-serif;
    --pad:56px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100vw;height:100vh}
  .stage{position:relative;width:100vw;height:100vh;overflow:hidden;font-family:var(--sans);background:#111}
  .bg{position:absolute;inset:0;background-position:center;background-size:cover;background-repeat:no-repeat}
  .stage.contain .bg{background-size:contain;background-position:center}
  .scrim{position:absolute;inset:0;pointer-events:none;
     background:linear-gradient(180deg, rgba(0,0,0,.28) 0%, rgba(0,0,0,0) 14%),
                linear-gradient(0deg, rgba(0,0,0,.30) 0%, rgba(0,0,0,0) 22%)}
  .stage.contain .scrim{display:none}
  /* band: fit image to full width at the bottom, fill the top strip with the image's own edge colour (keeps poster text uncropped) */
  .stage.band{background:var(--bandbg,#111)}
  .stage.band .bg{background-size:100% auto;background-position:center bottom}
  .stage.band .scrim{display:none}

  .handle{position:absolute;top:var(--pad);left:var(--pad);color:var(--ink);font-weight:700;font-size:25px;
          letter-spacing:-.01em;text-shadow:0 1px 10px rgba(0,0,0,.35);z-index:5}
  .stage.light .handle{color:#2B2B2B;text-shadow:none}

  /* headline block: left-aligned, sits in the lower-middle like the references */
  .copy{position:absolute;left:var(--pad);right:var(--pad);top:var(--copy-top,57%);z-index:4}
  .line{display:block;width:max-content;max-width:100%;color:var(--ink);font-weight:800;font-size:var(--fs,76px);
        line-height:1.0;letter-spacing:-.045em;text-shadow:0 3px 24px rgba(0,0,0,.45)}
  .hl{display:block;width:max-content;max-width:100%;background:var(--accent);color:var(--ink);font-weight:800;
      font-size:var(--fs,76px);line-height:1.0;letter-spacing:-.045em;padding:2px 12px 8px;margin:6px 0 6px -12px}
  [data-optional].empty{display:none}

  /* brand lockup (code-rendered): diya icon + serif wordmark + Devanagari line */
  .lockup{position:absolute;left:var(--pad);bottom:var(--pad);display:none;align-items:center;gap:18px;z-index:5}
  .stage.logo .lockup{display:flex}
  .lockup svg{width:78px;height:78px}
  .lockup .wm{font-family:'DM Serif Display',serif;font-size:50px;line-height:.95;color:var(--cream)}
  .lockup .dv{font-family:'Tiro Devanagari Hindi',serif;font-size:19px;color:var(--gold);letter-spacing:.06em;margin-top:6px}
</style>
</head>
<body>
  <div class="stage __SLIDECLASS__" style="__STAGESTYLE__">
    <div class="bg" id="bg"></div>
    <div class="scrim"></div>
    <div class="handle" data-optional>__HANDLE__</div>

    <div class="copy">
      <span class="line" data-optional>__HEADLINE__</span>
      <span class="hl" data-optional>__HERO_PHRASE__</span>
      <span class="line" data-optional>__CAPTION__</span>
    </div>

    <div class="lockup">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <path d="M50 8 C60 24 64 34 50 50 C36 34 40 24 50 8 Z" fill="#E9B44C"/>
        <path d="M50 22 C55 31 56 37 50 45 C44 37 45 31 50 22 Z" fill="#FFF3D6"/>
        <path d="M12 56 H88 C86 76 70 88 50 88 C30 88 14 76 12 56 Z" fill="#CE6A4A"/>
        <path d="M50 62 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3 z" fill="#E9B44C"/>
      </svg>
      <div><div class="wm">Meethi Roshni</div><div class="dv">मीठी रोशनी</div></div>
    </div>
  </div>
  <script>
    var BG="__BG__";
    if(BG) document.getElementById('bg').style.backgroundImage="url('"+BG+"')";
    document.querySelectorAll('[data-optional]').forEach(function(el){
      if(!el.textContent.trim()) el.classList.add('empty');
    });
  </script>
</body>
</html>
